<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>Batocera Web Services</title>
<link rel="icon" type="image/png" href="logo-tri.png">
<link rel="apple-touch-icon" href="logo-ios.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Batocera">
<!-- bootstrap -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
<!-- fonts icons -->
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.0/css/all.css" integrity="sha384-lZN37f5QGtY3VHgisS14W3ExzMWZxybE1SJSEsQp9S+oqd12jhcu+A56Ebc1zFSJ" crossorigin="anonymous">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">

<!-- inline CSS -->
<style>
:root {
    --netflix-red: #E50914;
    --netflix-black: #141414;
    --netflix-dark-gray: #181818;
    --netflix-card-bg: #2F2F2F;
    --netflix-light-gray: #AAA;
}

* {
    margin: 0;
    padding: 0;
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
}

body {
    background-color: var(--netflix-black);
    color: #FFFFFF;
    min-height: 100vh;
    padding-top: 140px;
    padding-bottom: 115px;
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--netflix-black); }
::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--netflix-red); }


/* Netflix-style Batocera Home */
#homeScreen {
    display: block;
    padding: 4px 8px 35px;
}

.home-hero {
    position: relative;
    padding: 4px 4px 18px;
    aspect-ratio: 16 / 9;
    max-height: 420px;
    min-height: 170px;
    display: flex;
    align-items: flex-end;
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 4px;
    background: #141414;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(0,0,0,.6);
}

.home-hero-slides {
    position: absolute;
    inset: 0;
    z-index: 0;
    display: flex;
    height: 100%;
    transition: transform 0.4s ease;
    touch-action: pan-y;
}

.home-hero-slide {
    position: relative;
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    background-size: cover;
    background-position: center;
}

.home-hero-overlay {
    position: absolute;
    inset: 0;
    z-index: 1;
    background: none;
}

.home-hero-content {
    position: relative;
    z-index: 2;
    padding: 12px 12px 4px;
    min-height: 44px;
    display: flex;
    align-items: flex-end;
}

.home-hero-marquee {
    max-height: 95px;
    max-width: 78%;
    object-fit: contain;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,.8));
}

.home-hero-title {
    font-family: "Bebas Neue", sans-serif;
    font-size: 2rem;
    letter-spacing: .8px;
    text-shadow: 0 2px 6px rgba(0,0,0,.95), 0 4px 16px rgba(0,0,0,.85), 0 0 30px rgba(0,0,0,.6);
}

.system-row {
    margin: 0 0 24px;
}

.system-row-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin: 0 4px 8px;
}

.system-row-title {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 10px;
    cursor: pointer;
}

.system-row-logo {
    height: 30px;
    max-width: 150px;
    object-fit: contain;
}

.system-row-name {
    font-size: 1.05rem;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.system-row-count {
    color: #888;
    font-size: 0.9rem;
    white-space: nowrap;
}

.system-row-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-behavior: smooth;
    scroll-snap-type: x proximity;
    padding: 4px 4px 12px;
    scrollbar-width: thin;
}

.system-row-scroll::-webkit-scrollbar {
    height: 5px;
}

/* --- HOMESCREEN AANPASSINGEN --- */
.home-game {
    flex: 0 0 auto;
    background: var(--netflix-card-bg);
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,.5);
    scroll-snap-align: start;
    transition: transform .18s ease, box-shadow .18s ease;
    cursor: pointer;
}

.home-game:focus-visible { outline: 2px solid var(--netflix-red); outline-offset: 2px; }

.home-game:hover {
    transform: scale(1.045);
    box-shadow: 0 8px 18px rgba(0,0,0,.8);
    z-index: 2;
}

.home-game-media {
    height: 200px;
    width: auto;
    background: #111;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.home-game-media img {
    height: 100%;
    width: auto;
    display: block;
    object-fit: contain;
}

.home-game-no-image {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
    color: #aaa;
    font-weight: 700;
    font-size: .8rem;
}

.home-game-play {
    position: absolute;
    right: 7px;
    bottom: 7px;
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    background: var(--netflix-red);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: translateY(4px);
    transition: opacity .15s, transform .15s;
    cursor: pointer;
}

.home-game:hover .home-game-play,
.home-game:focus-within .home-game-play {
    opacity: 1;
    transform: translateY(0);
}

.home-game-title {
    padding: 8px 8px 9px;
    font-size: .78rem;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.home-see-all {
    border: 0;
    background: transparent;
    color: #aaa;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
}

.home-see-all:hover {
    color: #fff;
}

body.home-mode {
    padding-top: 140px;
    padding-bottom: 15px;
}

body.games-mode {
    padding-top: 140px;
    padding-bottom: 115px;
}

@media (min-width: 768px) {
    body.home-mode { padding-top: 90px; padding-bottom: 15px; }
    body.games-mode { padding-top: 90px; padding-bottom: 75px; }
    #homeScreen { padding: 8px 15px 40px; }
    .home-hero { aspect-ratio: auto; min-height: 190px; max-height: none; }
    .home-hero h1 { font-size: 2.8rem; }
    .home-game-media { height: 260px; }
    .home-game { flex-basis: auto; width: auto; }
    .home-game-title { font-size: .85rem; }
}

/* Header Navbar */
.navbar {
    background-color: rgba(20, 20, 20, 0.98) !important;
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding: 10px 12px;
}

.brand-title {
    font-family: "Bebas Neue", sans-serif;
    color: var(--netflix-red);
    font-weight: 400;
    font-style: normal;
    font-size: 2.2rem;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    line-height: 1; /* Vertikale uitlijning met knoppen */
}

/* Buttons at the top */
.btn-netflix {
    background-color: var(--netflix-red);
    color: #FFF;
    font-weight: 700;
    border: none;
    border-radius: 4px;
    padding: 8px 15px;
    font-size: 1.05rem;
    transition: background-color 0.2s;
}
.btn-netflix:hover {
    background-color: #F40612;
    color: #FFF;
}

.btn-netflix-secondary {
    background-color: rgba(109, 109, 110, 0.7);
    color: #FFF;
    font-weight: 700;
    border: none;
    border-radius: 4px;
    padding: 8px 15px;
    font-size: 1.05rem;
    transition: background-color 0.2s;
}
.btn-netflix-secondary:hover {
    background-color: rgba(109, 109, 110, 0.4);
    color: #FFF;
}

.jumbo-container { width: 100%; }

.jumbo {
    background: rgba(30, 30, 30, 0.95);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 6px;
    padding: 6px 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.gameName {
    font-size: 0.95rem;
    font-weight: 700;
    color: #FFFFFF;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 250px;
    cursor: pointer;
}

.sysName {
    font-size: 0.75rem;
    color: var(--netflix-red);
    text-transform: uppercase;
    font-weight: 700;
    cursor: pointer;
}

/* Search bar */
.search-bar {
    margin: 0 -12px 0px;
    padding: 0 12px 4px;
}
.search-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    padding: 10px 12px;
}
.search-input-wrap i:first-child {
    color: rgba(255,255,255,0.6);
    margin-right: 8px;
}
.search-input-wrap input {
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    width: 100%;
    font-size: 1rem;
}
.search-dice {
    background: none;
    border: none;
    color: var(--netflix-red);
    padding: 0 6px;
    font-size: 1.6rem;
    line-height: 1;
}
.search-close {
    background: none;
    border: none;
    color: rgba(255,255,255,0.6);
    padding: 0 0 0 8px;
}
.search-results {
    max-height: 55vh;
    overflow-y: auto;
    margin-top: 6px;
}
.search-result-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 4px;
    border-radius: 6px;
    cursor: pointer;
}
.search-result-item:hover, .search-result-item:focus-visible {
    background: rgba(255,255,255,0.08);
}
.search-result-item img, .search-result-noimg {
    width: 42px;
    height: 56px;
    object-fit: cover;
    border-radius: 4px;
    background: #222;
    flex-shrink: 0;
}
.search-result-name {
    font-weight: 700;
    font-size: 0.9rem;
}
.search-result-system {
    font-size: 0.72rem;
    color: var(--netflix-red);
    text-transform: uppercase;
    font-weight: 700;
}
.search-empty {
    color: rgba(255,255,255,0.6);
    font-size: 0.85rem;
    padding: 10px 4px;
}

/* Catalog Grid */
.main-content {
    padding: 10px 4px;
}

/* --- CONSOLE / CATALOGUS GRID AANPASSINGEN --- */
.games-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    gap: 10px;
}

.card-game {
    width: calc((100% - 20px) / 3);
    background-color: var(--netflix-card-bg);
    border: none;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.card-game:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.8);
}

.card-img-container {
    width: 100%;
    flex: 1 1 auto;
    background-color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
}

.card-img-backdrop {
    position: absolute;
    inset: -12%;
    background-size: cover;
    background-position: center;
    filter: blur(18px) brightness(0.45);
    transform: scale(1.1);
    z-index: 0;
}

.card-img-cover {
    position: relative;
    z-index: 1;
    width: 100%;
    height: auto;
    display: block;
    object-fit: contain;
}

.card-title-container {
    padding: 4px 2px 2px 2px;
    background: var(--netflix-card-bg);
}

.card-game-title {
    font-size: 0.75rem;
    font-weight: 700;
    text-align: center;
    color: #FFF;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-title-marquee {
    max-height: 30px;
    max-width: 100%;
    object-fit: fill;
    display: block;
    margin: 0 auto;
}

.card-body-custom {
    padding: 2px 2px 4px 2px;
    font-size: 0.6rem;
    color: var(--netflix-light-gray);
}

.badge-netflix {
    background-color: rgba(255, 255, 255, 0.1);
    color: #DDD;
    font-size: 0.55rem;
    padding: 1px 3px;
    border-radius: 3px;
    margin: 1px;
    display: inline-block;
}

/* Game action buttons */
.card-footer-custom {
    padding: 8px 4px;
    background-color: var(--netflix-card-bg);
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: auto;
    flex-wrap: wrap;
}

.card-footer-custom .btn {
    font-size: 0.95rem;
    padding: 6px 12px;
    flex: 1;
    max-width: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Desktop & tablet responsive breakpoints */
@media (min-width: 768px) {
    body { padding-top: 90px; padding-bottom: 75px; }
    .main-content { padding: 10px 15px; }
    .games-grid { gap: 12px; }
    .card-game { width: calc(16.666% - 10px); }
    .card-game-title { font-size: 0.85rem; }
    .card-body-custom { font-size: 0.7rem; }
    .card-footer-custom .btn { font-size: 1.1rem; padding: 8px 16px; max-width: 70px; }
    .gameName { font-size: 1.1rem; max-width: 350px; }
    .sysName { font-size: 0.85rem; }
    .btn-text { display: inline !important; }
}

.btn-text { display: none; }

/* Bottom system carousel */
.navbar-fixed-bottom-custom {
    position: fixed;
    bottom: 0;
    right: 0;
    left: 0;
    width: 100%;
    z-index: 1030;
    background: #000;
    border-top: 1px solid rgba(255, 255, 255, 0.15);
    overflow: hidden;
}

.system-carousel-wrapper {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
}

.carousel-container-inner {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
}

.sys-btn {
    padding: 0;
    display: block; 
    align-items: center;
    justify-content: center;
}

.sys-btn .btn-dark {
    width: 100%;
    height: 44px;
    background-color: #1c1c1c;
    border: none;
    border-radius: 0;
    padding: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.sys-btn .btn-dark:hover, .sys-btn .btn-dark.active {
    background-color: #2a2a2a;
    box-shadow: inset 0 0 0 1px var(--netflix-red);
}

.sys-btn .btn-dark img {
    height: 32px;
    max-width: 85%;
    object-fit: contain;
}

/* Side navigation buttons */
.carousel-btn-side {
    flex: 0 0 38px;
    width: 38px;
    height: 88px;
    background-color: var(--netflix-red);
    border: none;
    color: #FFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    cursor: pointer;
    z-index: 20;
    transition: background-color 0.2s;
    text-decoration: none !important;
}

@media (min-width: 768px) {
    .carousel-btn-side {
        height: 44px;
    }
}

.carousel-btn-side:hover {
    background-color: #F40612;
    color: #FFF;
}

.modal-content {
    background-color: var(--netflix-dark-gray);
    color: #FFF;
    border: 1px solid rgba(255, 255, 255, 0.1);
}

#loading-indicator {
    min-height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#loading-indicator.hidden {
    display: none !important;
}

/* Game detail media */
.detail-media {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
}
.detail-media img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    border-radius: 6px;
}
.detail-video-play {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 0;
    background: rgba(229, 9, 20, 0.95);
    color: #fff;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 1.55rem;
    box-shadow: 0 4px 18px rgba(0,0,0,.65);
    z-index: 5;
    cursor: pointer;
}
.detail-video-play:hover {
    transform: translate(-50%, -50%) scale(1.08);
    background: #F40612;
}
.detail-video-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    z-index: 6;
    background: #000;
    border-radius: 6px;
    overflow: hidden;
}
.detail-video-container video {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    background: #000;
}
.detail-media.has-video .detail-video-play {
    display: flex;
}
.detail-media.is-playing .detail-video-container {
    display: block;
}
.detail-media.is-playing .detail-video-play,
.detail-media.is-playing #detailModalImg {
    display: none;
}

.detail-marquee-wrap {
    text-align: center;
    margin-bottom: 10px;
}
.detail-marquee-img {
    max-height: 56px;
    max-width: 80%;
    padding-top: 5px;
    object-fit: contain;
    display: inline-block;
}
.detail-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-top: 12px;
}
.detail-badges .badge-netflix {
    font-size: 0.75rem;
    padding: 4px 9px;
}
.detail-desc-text {
    margin-top: 12px;
}
.detail-footer-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    width: 100%;
    justify-content: space-between;
    align-items: center;
}
.detail-footer-extras {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}
.detail-footer-main {
    display: flex;
    gap: 8px;
    margin-left: auto;
}

.card-game, .home-game {
    cursor: pointer;
}
.card-game:focus-visible, .home-game:focus-visible {
    outline: 2px solid var(--netflix-red);
    outline-offset: 2px;
}

#splashScreen {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 1s ease;
}
#splashScreen.splash-hide {
    opacity: 0;
    pointer-events: none;
}
.splash-title {
    font-family: "Bebas Neue", sans-serif;
    color: var(--netflix-red);
    font-weight: 400;
    font-style: normal;
    font-size: 4.5rem;
    letter-spacing: 3px;
    opacity: 0;
    animation: fadeInTitle 1s forwards ease-in-out;
}
@keyframes fadeInTitle {
    from { opacity: 0; }
    to { opacity: 1; }
}
</style>
</head>

<body>
<div id="splashScreen"><span class="splash-title">BATOCERA</span></div>
<script>
setTimeout(function() {
    var splash = document.getElementById('splashScreen');
    if (!splash) return;
    splash.classList.add('splash-hide');
    setTimeout(function() { splash.remove(); }, 1000);
}, 2000);
</script>

<script type='text/javascript'>

function reloadGamelists() {
    fetch('/reloadgames');
}

function emuKill() {
    fetch('/emukill');
}

function launchGame(game) {
    fetch('/launch', {
        method: 'POST',
        headers: {'Content-Type':'application/x-www-form-urlencoded'},
        body: game
    });
}

function escapeHtml(unsafe) {
    return unsafe
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeRom(unsafe) {
    return unsafe
    .replace(/'/g, "");
}

function getVideoPath(imageUrl, thumbUrl) {
    var mediaUrl = imageUrl || thumbUrl || "";
    if (!mediaUrl) return "";

    if (/\/media\/[^/?#]+(?:[?#].*)?$/.test(mediaUrl)) {
        return mediaUrl.replace(/\/media\/[^/?#]+(?:[?#].*)?$/, "/media/video");
    }

    return "";
}

let currentGames = [];
let visibleGames = [];
const GAMES_PER_BATCH = 50;
let currentBatch = 0;
let isLoading = false;
let gameScrollObserver = null;
let currentSystemName = null;
let loadingCancelled = false;

function showGames(arr) {
    currentGames = arr.filter(game => game.hidden !== "true");
    currentBatch = 0;
    visibleGames = [];
    loadingCancelled = false;

    const gameList = document.getElementById("gameList");
    gameList.innerHTML = '';

    if (gameScrollObserver) {
        gameScrollObserver.disconnect();
        gameScrollObserver = null;
    }

    gameList.innerHTML = '<div class="games-grid" id="gameContainer"></div>';

    loadMoreGames();

    if (currentGames.length > GAMES_PER_BATCH) {
        setupInfiniteScroll();
    }
}

function loadMoreGames() {
    if (isLoading || loadingCancelled || currentBatch * GAMES_PER_BATCH >= currentGames.length) {
        return;
    }

    isLoading = true;
    const startIndex = currentBatch * GAMES_PER_BATCH;
    const endIndex = Math.min(startIndex + GAMES_PER_BATCH, currentGames.length);
    const batch = currentGames.slice(startIndex, endIndex);

    const gameContainer = document.getElementById("gameContainer");

    batch.forEach(game => {
        if (loadingCancelled) return;
        const cardElement = createGameCardElement(game);
        gameContainer.appendChild(cardElement);
        visibleGames.push(game);
    });

    currentBatch++;
    isLoading = false;

    const loadingIndicator = document.getElementById("loading-indicator");
    if (loadingIndicator && currentBatch * GAMES_PER_BATCH >= currentGames.length) {
        loadingIndicator.classList.add('hidden');
    }
}

function createGameCardElement(game) {
    const cardDiv = document.createElement('div');
    cardDiv.className = 'card card-game';
    cardDiv.setAttribute('tabindex', '0');
    cardDiv.setAttribute('role', 'button');
    cardDiv.setAttribute('aria-label', game.name || 'Game');
    cardDiv.setAttribute('data-toggle', 'modal');
    cardDiv.setAttribute('data-target', '#detailModal');
    cardDiv.setAttribute('data-desc', escapeHtml(game.desc || ''));
    cardDiv.setAttribute('data-name', escapeHtml(game.name || ''));
    cardDiv.setAttribute('data-thumb', game.thumbnail || '');
    cardDiv.setAttribute('data-image', game.image || '');
    cardDiv.setAttribute('data-marquee', game.marquee || '');
    cardDiv.setAttribute('data-path', escapeHtml(game.path || ''));
    cardDiv.setAttribute('data-genre', game.genre || '');
    cardDiv.setAttribute('data-releasedate', game.releasedate || '');
    cardDiv.setAttribute('data-playcount', game.playcount || '');
    cardDiv.setAttribute('data-favorite', game.favorite || '');
    cardDiv.setAttribute('data-cheevos', game.cheevosHash || '');
    cardDiv.setAttribute('data-manual', game.manual || '');
    cardDiv.setAttribute('data-map', game.map || '');
    cardDiv.setAttribute('data-system', currentSystemName || '');

    let cardHtml = '';
    var coverSrc = game.thumbnail || game.image || '';

    if (coverSrc) {
        cardHtml += '<div class="card-img-container">' +
            '<div class="card-img-backdrop" style="background-image:url(&quot;' + coverSrc + '&quot;)"></div>' +

        if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            detailFill(ev);
        }
    });

    return cardDiv;

function setupInfiniteScroll() {
    const loadingDiv = document.createElement('div');
    loadingDiv.id = 'loading-indicator';
    loadingDiv.className = 'w-100 text-center p-3';
    loadingDiv.innerHTML = '<div class="spinner-border text-light" role="status"><span class="sr-only">Loading more games...</span></div><p class="text-light mt-2">Loading more games...</p>';

    const gameContainer = document.getElementById("gameContainer");
    const gameList = document.getElementById("gameList");
    const rowContainer = gameContainer.parentElement;
    rowContainer.appendChild(loadingDiv);

    gameScrollObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && !isLoading && !loadingCancelled && currentBatch * GAMES_PER_BATCH < currentGames.length) {
                setTimeout(() => {
                    if (!isLoading && !loadingCancelled && currentBatch * GAMES_PER_BATCH < currentGames.length) {
                        loadMoreGames();
                    }
                }, 100);
            }
        });
    }, {
        root: null,
        rootMargin: '100px',
        threshold: 0.1
    });

    gameScrollObserver.observe(loadingDiv);
}

function getOrder(prop) {
    return function(a, b) {
        if (a[prop] > b[prop]) {
            return 1;
        } else if (a[prop] < b[prop]) {
            return -1;
        }
        return 0;
    }
}

function loadGames(name) {
    showGamesView();
    loadingCancelled = true;
    currentSystemName = name;

    if (gameScrollObserver) {
        gameScrollObserver.disconnect();
        gameScrollObserver = null;
    }

    document.getElementById("gameList").innerHTML = '<div class="text-center p-5"><div class="spinner-border text-light" role="status"><span class="sr-only">Loading...</span></div><p class="mt-3">Loading games...</p></div>';

    var xhr = new XMLHttpRequest();
    xhr.onreadystatechange = function() {
        if (this.readyState == 4 && this.status == 200) {
            if (currentSystemName === name) {
                var myArr = JSON.parse(this.responseText);
                myArr.sort(getOrder("name"));
                showGames(myArr);
            }
        }
    };
    xhr.open('GET', '/systems/' + name + '/games');
    xhr.send();
}

var ALL_GAMES = [];

async function loadHome(systems) {
    var home = document.getElementById('homeScreen');
    if (!home) return;

    home.innerHTML =
        '<div class="home-hero" id="homeHero" role="button" tabindex="0" aria-label="Open game">' +
        '<div class="home-hero-slides" id="heroSlides"></div>' +
        '<div class="home-hero-overlay"></div>' +
        '<div class="home-hero-content" id="heroContent"></div>' +
        '</div>' +
'<br>' +
        '<div id="homeRows"></div>';

    var rows = document.getElementById('homeRows');
    var visibleSystems = systems.filter(function(s) { return s.visible == "true"; });

    var results = await Promise.all(visibleSystems.map(async function(system) {
        try {
            var response = await fetch('/systems/' + system.name + '/games');
            if (!response.ok) return {system: system, games: []};
            var games = await response.json();
            games = games.filter(function(game) { return game.hidden !== "true"; });
            games.forEach(function(g) { g.systemName = system.name; g.systemFullname = system.fullname || system.name; });
            games.sort(getOrder("name"));
            return {system: system, games: games};
        } catch (e) {
            console.warn('Could not load games for ' + system.name, e);
            return {system: system, games: []};
        }
    }));

    ALL_GAMES = [];
    results.forEach(function(result) { ALL_GAMES = ALL_GAMES.concat(result.games); });

    results.forEach(function(result) {
        if (result.games.length > 0) {
            rows.appendChild(createHomeSystemRow(result.system, result.games));
        }
    });

    startHeroSlideshow(ALL_GAMES);
}

var heroSlideInterval = null;
var heroSlideGames = [];
var heroSlideIndex = 0;
var heroSwiped = false;

function startHeroSlideshow(games) {
    var container = document.getElementById('heroSlides');
    var hero = document.getElementById('homeHero');
    if (!container || !hero) return;

    var pool = games.filter(function(g) { return g.image || g.thumbnail; });
    if (pool.length === 0) return;

    heroSlideGames = pool.slice().sort(function() { return Math.random() - 0.5; }).slice(0, 8);

    container.innerHTML = heroSlideGames.map(function(g) {
        var src = g.image || g.thumbnail;
        return '<div class="home-hero-slide" style="background-image:url(&quot;' + src + '&quot;)"></div>';
    }).join('');

    heroSlideIndex = 0;
    container.style.transition = 'none';
    container.style.transform = 'translateX(0%)';
    updateHeroContent();
    // transition weer aanzetten na de eerste, ongeanimeerde render
    requestAnimationFrame(function() { container.style.transition = ''; });

    // Klikken/Enter op de hero opent de infopopup - maar niet als het net een swipe was.
    hero.onclick = function() {
        if (heroSwiped) { heroSwiped = false; return; }
        var game = heroSlideGames[heroSlideIndex];
        if (game) openGameDetail(game);
    };
    hero.onkeydown = function(ev) {
        if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            hero.onclick();
        } else if (ev.key === 'ArrowRight') {
            goToHeroSlide(heroSlideIndex + 1);
            restartHeroInterval();
        } else if (ev.key === 'ArrowLeft') {
            goToHeroSlide(heroSlideIndex - 1);
            restartHeroInterval();
        }
    };

    setupHeroSwipe(hero, container);
    restartHeroInterval();
}

function goToHeroSlide(newIndex) {
    var count = heroSlideGames.length;
    if (count === 0) return;
    heroSlideIndex = ((newIndex % count) + count) % count;
    var container = document.getElementById('heroSlides');
    if (container) container.style.transform = 'translateX(-' + (heroSlideIndex * 100) + '%)';
    updateHeroContent();
}

function restartHeroInterval() {
    if (heroSlideInterval) clearInterval(heroSlideInterval);
    if (heroSlideGames.length <= 1) return;
    heroSlideInterval = setInterval(function() {
        goToHeroSlide(heroSlideIndex + 1);
    }, 5000);
}

// Swipe met je vinger door de slideshow - volgt live mee met je vinger,
// en snapt daarna naar de dichtstbijzijnde slide.
function setupHeroSwipe(hero, container) {
    var startX = 0, currentX = 0, dragging = false, width = 1;

    hero.addEventListener('touchstart', function(ev) {
        if (ev.touches.length !== 1) return;
        dragging = true;
        heroSwiped = false;
        startX = currentX = ev.touches[0].clientX;
        width = hero.getBoundingClientRect().width || 1;
        if (heroSlideInterval) clearInterval(heroSlideInterval);
        container.style.transition = 'none';
    }, { passive: true });

    hero.addEventListener('touchmove', function(ev) {
        if (!dragging) return;
        currentX = ev.touches[0].clientX;
        var dx = currentX - startX;
        if (Math.abs(dx) > 8) heroSwiped = true;
        var basePercent = -(heroSlideIndex * 100);
        var dragPercent = (dx / width) * 100;
        container.style.transform = 'translateX(' + (basePercent + dragPercent) + '%)';
    }, { passive: true });

    hero.addEventListener('touchend', function() {
        if (!dragging) return;
        dragging = false;
        container.style.transition = '';
        var dx = currentX - startX;
        if (Math.abs(dx) > width * 0.15 || Math.abs(dx) > 60) {
            goToHeroSlide(heroSlideIndex + (dx < 0 ? 1 : -1));
        } else {
            goToHeroSlide(heroSlideIndex);
        }
        restartHeroInterval();
        setTimeout(function() { heroSwiped = false; }, 80);
    });
}

        fetch(url).then(response => response.blob())

                const imgE = document.createElement('img');
                const imgUrl = URL.createObjectURL(blob);
                imgE.src = imgUrl;
                imgE.style.height = "16px";
                const container = document.getElementById("sysName");
                if (container) {
                    container.innerHTML = '';
                    container.appendChild(imgE);
                }
            });
        out += '<div class="sysName" id="sysName" title="">' + d.systemName + '</div>';
    }
    if (d.name) {
        out += '<div class="gameName" id="gameName" title="">' + d.name + '</div>';
    }
    out += '</div></div>';
    return (out);
}

var PREVDATA = null;

// Batocera levert sommige systeemnamen (o.a. de automatische 'favorites' en
// 'lastplayed'-verzamelingen) met een kleine letter aan - hier normaliseren
// we dat naar een hoofdletter, zodat het overal netjes oogt.
function capitalizeFirst(str) {
    if (!str) return str;
    return str.charAt(0).toUpperCase() + str.slice(1);
}

$(document).ready(function() {
    document.body.classList.add('home-mode');
    fetch('/systems')
    .then(response => response.json())
    .then(data => {
        data.forEach(function(system) {
            if (system.fullname) system.fullname = capitalizeFirst(system.fullname);
            else if (system.name) system.fullname = capitalizeFirst(system.name);
        });
        showSystems(data);
        showHomeView();
        loadHome(data);
    });

    var latestOutput = document.getElementById("jumbo");
    var wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var wsHost = location.host;
    wsHost = wsHost.split(':')[0]+":8080"
    var wsUrl = wsProtocol + '//' + wsHost + '/';
    var ws = new WebSocket(wsUrl);
    ws.onmessage = function(event) {
        var d = event.data;
        if (PREVDATA != d) {
            var dd = JSON.parse(d);
            latestOutput.innerHTML = describe(dd);
            PREVDATA = d;
        }
    };
    ws.onclose = function() {
        var message = { "msg": "ERROR" };
        latestOutput.innerHTML = describe(message);
    };
});

<script>
function toggleSearch() {
    var bar = $('#searchBar');
    if (!bar.length) return;
    var willShow = !bar.hasClass('show');
    bar.collapse('toggle');
    if (willShow) {
        var input = document.getElementById('searchInput');
        if (input) { input.value = ''; setTimeout(function() { input.focus(); }, 150); }
        document.getElementById('searchResults').innerHTML = '';
    }
}

function playRandomGame() {
    if (!ALL_GAMES || ALL_GAMES.length === 0) return;
    var game = ALL_GAMES[Math.floor(Math.random() * ALL_GAMES.length)];
    toggleSearch();
    openGameDetail(game);
}

function onSearchInput(value) {
    var resultsEl = document.getElementById('searchResults');
    if (!resultsEl) return;
    var q = (value || '').trim().toLowerCase();
    if (q.length < 2) { resultsEl.innerHTML = ''; return; }

    var matches = (typeof ALL_GAMES !== 'undefined' ? ALL_GAMES : [])
        .filter(function(g) { return g.name && g.name.toLowerCase().indexOf(q) !== -1; })
        .slice(0, 30);

    if (matches.length === 0) {
        resultsEl.innerHTML = '<div class="search-empty">No games found for "' + escapeHtml(value) + '".</div>';
        return;
    }

    resultsEl.innerHTML = matches.map(function(g) {
        var img = g.thumbnail || g.image || '';
        return '<div class="search-result-item" data-idx="' + ALL_GAMES.indexOf(g) + '">' +
            (img ? '<img loading="lazy" src="' + img + '">' : '<div class="search-result-noimg"></div>') +
            '<div class="search-result-info"><div class="search-result-name">' + escapeHtml(g.name) + '</div>' +
            '<div class="search-result-system">' + escapeHtml(g.systemFullname || g.systemName || '') + '</div></div>' +
            '</div>';
    }).join('');

    resultsEl.querySelectorAll('.search-result-item').forEach(function(el) {
        el.addEventListener('click', function() {
            var idx = parseInt(el.getAttribute('data-idx'));
            var game = ALL_GAMES[idx];
            if (game) {
                toggleSearch();
                openGameDetail(game);
            }
        });
    });
}
</script>

            if (nav) new ResizeObserver(syncNavOffset).observe(nav);

})();

<script>
// Swipe-ondersteuning voor de consolebalk onderin (naast de bestaande pijltjes-knoppen).
(function() {
    var carouselEl = document.getElementById('sysCarousel');
    if (!carouselEl) return;

    var startX = 0, startY = 0, tracking = false;

    carouselEl.addEventListener('touchstart', function(ev) {
        var t = ev.touches[0];
        startX = t.clientX;
        startY = t.clientY;
        tracking = true;
    }, { passive: true });

    carouselEl.addEventListener('touchend', function(ev) {
        if (!tracking) return;
        tracking = false;
        var t = ev.changedTouches[0];
        var dx = t.clientX - startX;
        var dy = t.clientY - startY;
        // Alleen duidelijk horizontale swipes tellen, verticaal scrollen blijft gewoon werken.
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5) {
            if (dx < 0) {
                $('#sysCarousel').carousel('next');
            } else {
                $('#sysCarousel').carousel('prev');
            }
        }
    }, { passive: true });
})();
</script>
